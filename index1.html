<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Wer oder was bin ich?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #141414;
    --bg-raised: #222222;
    --bg-chip: #333333;
    --text: #FFFFFF;
    --text-muted: #9A9A9A;
    --accent: #F7CF4A;
    --accent-ink: #1A1500;
    --good: #6FD16F;
    --bad: #E8503C;
    --ink: #161616;
    --radius: 28px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; } }
  :root[data-theme="dark"] { color-scheme: dark; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    font-weight: 600;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  /* ---------- Screens ---------- */
  .screen { display: none; min-height: 100%; }
  .screen.active { display: block; }

  /* ---------- Setup ---------- */
  #setup { padding: 0 20px 140px; max-width: 640px; margin: 0 auto; }
  .brand { padding: 28px 0 10px; }
  .brand h1 {
    margin: 0; font-size: clamp(34px, 9vw, 52px); font-weight: 800; line-height: .95; letter-spacing: -.02em;
  }
  .brand h1 span { color: var(--accent); }
  .brand p { margin: 10px 0 0; color: var(--text-muted); font-size: 15px; }

  .section-title { margin: 28px 0 12px; font-size: 22px; font-weight: 800; }

  .slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .slot {
    aspect-ratio: 1; border-radius: var(--radius); background: var(--bg-raised);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    color: var(--text-muted); font-size: 14px; text-align: center; padding: 8px;
  }
  .slot .em { font-size: 36px; line-height: 1; }
  .slot.filled { background: var(--accent); color: var(--text); text-shadow: 0 1px 0 rgba(0,0,0,.15); }
  .slot.filled .label { font-weight: 800; }

  .toggle {
    width: 100%; margin-top: 16px; display: flex; align-items: center; gap: 14px; text-align: left;
    padding: 16px 18px; border-radius: var(--radius); background: var(--bg-raised);
  }
  .toggle .t-em { font-size: 34px; line-height: 1; }
  .toggle .t-text { flex: 1; display: flex; flex-direction: column; gap: 3px; }
  .toggle b { font-size: 18px; font-weight: 800; }
  .toggle small { font-size: 13px; color: var(--text-muted); line-height: 1.3; }
  .toggle .t-switch { width: 50px; height: 30px; border-radius: 999px; background: var(--bg-chip); position: relative; flex-shrink: 0; transition: background .15s; }
  .toggle .t-switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .toggle[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .toggle[aria-pressed="true"] small { color: rgba(26,21,0,.7); }
  .toggle[aria-pressed="true"] .t-switch { background: var(--accent-ink); }
  .toggle[aria-pressed="true"] .t-switch::after { transform: translateX(20px); background: var(--accent); }
  .durations { display: flex; gap: 8px; }
  .durations button {
    flex: 1; padding: 14px 0; border-radius: 999px; background: var(--bg-raised); font-weight: 800; font-size: 16px;
  }
  .durations button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

  .cats { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .cat {
    position: relative; aspect-ratio: 1; border-radius: var(--radius); background: var(--bg-raised);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    font-size: 19px; font-weight: 800; text-align: center; padding: 12px;
    transition: transform .12s ease, background .12s ease;
  }
  .cat:active { transform: scale(.97); }
  .cat .em { font-size: 52px; line-height: 1; }
  .cat .mark {
    position: absolute; top: 14px; right: 14px; width: 24px; height: 24px; border-radius: 50%;
    border: 2.5px solid var(--text); display: grid; place-items: center;
  }
  .cat .mark::after { content: ""; width: 7px; height: 11px; border: solid var(--text); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg) translate(-1px,-1px); opacity: 0; }
  .cat[aria-pressed="true"] { background: var(--accent); }
  .cat[aria-pressed="true"] .mark::after { opacity: 1; }
  .cat.disabled { opacity: .45; }

  .startbar {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 20px calc(18px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to top, var(--bg) 60%, transparent); display: flex; justify-content: center;
  }
  .start {
    width: min(100%, 600px); padding: 18px 24px; border-radius: 999px; background: var(--accent); color: var(--accent-ink);
    font-size: 20px; font-weight: 800; box-shadow: 0 10px 30px rgba(247,207,74,.25);
  }
  .start:disabled { background: var(--bg-chip); color: var(--text-muted); box-shadow: none; }

  /* ---------- Game ---------- */
  #game { position: fixed; inset: 0; display: none; background: var(--bg); color: var(--text); transition: background .15s ease; }
  #game.active { display: block; }
  #game.ph-correct { background: var(--good); color: var(--ink); }
  #game.ph-skip { background: var(--bad); color: var(--ink); }
  .topbar {
    position: absolute; left: 0; right: 0; top: 0; z-index: 3; display: flex; align-items: center; justify-content: space-between;
    padding: calc(14px + env(safe-area-inset-top, 0px)) 24px 0;
  }
  .round-btn {
    width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,.14); display: grid; place-items: center; color: #fff;
  }
  .round-btn svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  #game.ph-correct .round-btn, #game.ph-skip .round-btn { background: rgba(0,0,0,.14); }
  .clock { font-size: 34px; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; min-width: 60px; text-align: center; }
  #game.ph-correct .clock, #game.ph-skip .clock { color: #fff; }

  .stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 70px 40px; text-align: center; }
  .stage .big {
    font-size: clamp(40px, 11vw, 120px); font-weight: 800; letter-spacing: -.01em; line-height: 1; color: var(--accent);
    word-break: break-word; max-width: 100%;
  }
  .stage .shout { color: inherit; text-transform: uppercase; }
  #game.ph-correct .big, #game.ph-skip .big { color: var(--ink); }
  .pic { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .pic-em { font-size: clamp(110px, 32vh, 260px); line-height: 1.1; }
  .pic-label { font-size: clamp(22px, 4vw, 40px); font-weight: 800; color: var(--text); opacity: .85; }
  .ready { display: flex; flex-direction: column; align-items: center; gap: 18px; max-width: 760px; }
  .ready .em { font-size: 64px; line-height: 1; }
  .ready p { margin: 0; font-size: clamp(18px, 3.2vw, 30px); font-weight: 800; line-height: 1.25; }
  .hint { font-size: 15px; color: var(--text-muted); font-weight: 600; }

  .sensor-note { font-size: 14px; color: var(--text-muted); font-weight: 600; max-width: 640px; line-height: 1.35; }
  .sensor-note b { color: var(--accent); }
  .manual {
    position: absolute; left: 0; right: 0; z-index: 3; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: none;
    justify-content: center; gap: 12px; padding: 0 20px;
  }
  .manual.show { display: flex; }
  .manual button { padding: 12px 22px; border-radius: 999px; font-weight: 800; font-size: 16px; color: var(--ink); }
  .manual .m-skip { background: var(--bad); }
  .manual .m-ok { background: var(--good); }
  .manual .m-start { background: var(--accent); }

  .dot { position: absolute; left: 50%; bottom: calc(48px + env(safe-area-inset-bottom, 0px)); width: 14px; height: 14px; border-radius: 50%; background: var(--bad); transform: translateX(-50%); display: none; }
  #game.ph-play .dot { display: block; }

  #rotate {
    position: fixed; inset: 0; z-index: 20; background: var(--bg); display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; text-align: center; padding: 30px; font-size: 22px; font-weight: 800;
  }
  #rotate .em { font-size: 64px; animation: spin 1.6s ease-in-out infinite alternate; }
  @keyframes spin { from { transform: rotate(0); } to { transform: rotate(-90deg); } }
  @media (prefers-reduced-motion: reduce) { #rotate .em { animation: none; } }
  @media (orientation: portrait) { body.playing #rotate { display: flex; } }

  /* ---------- Result ---------- */
  #result { padding: 0 20px 120px; max-width: 640px; margin: 0 auto; }
  .score { padding: 36px 0 8px; text-align: center; }
  .score .num { font-size: 120px; font-weight: 800; line-height: .9; color: var(--accent); letter-spacing: -.03em; }
  .score .of { color: var(--text-muted); font-size: 18px; margin-top: 10px; }
  .words { display: flex; flex-wrap: wrap; gap: 8px; }
  .words span { padding: 10px 16px; border-radius: 999px; background: var(--bg-raised); font-size: 16px; }
  .words.good span { background: var(--good); color: var(--ink); font-weight: 800; }
  .words.bad span { background: var(--bg-raised); color: var(--text-muted); text-decoration: line-through; }
  .empty { color: var(--text-muted); font-size: 15px; }
  .result-actions { display: flex; flex-direction: column; gap: 10px; width: min(100%, 600px); }
  .ghost { width: 100%; padding: 16px; border-radius: 999px; background: var(--bg-raised); font-weight: 800; font-size: 17px; }
</style>
</head>
<body>

<!-- ============ SETUP ============ -->
<section id="setup" class="screen active">
  <header class="brand">
    <h1>Wer oder was<br>bin <span>ich?</span></h1>
    <p>Handy an die Stirn, Freunde beschreiben, du rätst. Nach vorne kippen = richtig, nach hinten = überspringen.</p>
  </header>

  <h2 class="section-title">Wähle 1 bis 3 Kategorien</h2>
  <div class="slots" id="slots"></div>

  <button class="toggle" id="kidsToggle" aria-pressed="false">
    <span class="t-em">🧒</span>
    <span class="t-text"><b>Kindermodus</b><small>Begriffe als Bilder – auch für Mitspieler, die noch nicht lesen können</small></span>
    <span class="t-switch" aria-hidden="true"></span>
  </button>

  <h2 class="section-title">Rundenzeit</h2>
  <div class="durations" id="durations">
    <button data-sec="60" aria-pressed="false">60 s</button>
    <button data-sec="90" aria-pressed="false">90 s</button>
    <button data-sec="120" aria-pressed="true">120 s</button>
  </div>

  <h2 class="section-title">Kategorien</h2>
  <div class="cats" id="cats"></div>

  <div class="startbar">
    <button class="start" id="startBtn" disabled>Wähle eine Kategorie</button>
  </div>
</section>

<!-- ============ GAME ============ -->
<section id="game">
  <div class="topbar">
    <button class="round-btn" id="quitBtn" aria-label="Runde beenden">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="clock" id="clock"></div>
    <button class="round-btn" id="soundBtn" aria-label="Ton an/aus" aria-pressed="true">
      <svg id="sndOn" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a8 8 0 0 1 0 11"/></svg>
      <svg id="sndOff" viewBox="0 0 24 24" style="display:none"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l4 6M21 9l-4 6"/></svg>
    </button>
  </div>
  <div class="stage" id="stage"></div>
  <div class="dot"></div>
  <div class="manual" id="manual"></div>
</section>

<div id="rotate"><div class="em">📱</div>Dreh dein Handy ins Querformat</div>

<!-- ============ RESULT ============ -->
<section id="result" class="screen">
  <div class="score">
    <div class="num" id="scoreNum">0</div>
    <div class="of" id="scoreOf"></div>
  </div>
  <h2 class="section-title">Erraten</h2>
  <div class="words good" id="goodList"></div>
  <h2 class="section-title">Übersprungen</h2>
  <div class="words bad" id="badList"></div>
  <h2 class="section-title" style="margin-top:36px"></h2>
  <div class="result-actions">
    <button class="start" id="againBtn">Nochmal spielen</button>
    <button class="ghost" id="changeBtn">Kategorien ändern</button>
  </div>
</section>

/* ---------------- Einstellungen ---------------- */
let selected = [];
let selectedByMode = { normal: [], kids: [] };
let kidsMode = false;
let duration = 120;
let soundOn = true;
const CATS = () => kidsMode ? KID_CATEGORIES : CATEGORIES;

function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem('wwbi-settings') || '{}');
    if (s.kidsMode === true) kidsMode = true;
    if (s.selectedByMode) {
      selectedByMode.normal = (s.selectedByMode.normal || []).filter(id => CATEGORIES.some(c => c.id === id)).slice(0, 3);
      selectedByMode.kids = (s.selectedByMode.kids || []).filter(id => KID_CATEGORIES.some(c => c.id === id)).slice(0, 3);
    }
    selected = selectedByMode[kidsMode ? 'kids' : 'normal'];
    if ([60, 90, 120].includes(s.duration)) duration = s.duration;
    if (typeof s.soundOn === 'boolean') soundOn = s.soundOn;
  } catch (e) {}
}
function saveSettings() {
  selectedByMode[kidsMode ? 'kids' : 'normal'] = selected;
  try { localStorage.setItem('wwbi-settings', JSON.stringify({ selectedByMode, kidsMode, duration, soundOn })); } catch (e) {}
}

/* ---------------- Setup-Screen ---------------- */
const $ = id => document.getElementById(id);
const slotsEl = $('slots'), catsEl = $('cats'), startBtn = $('startBtn');

function renderSetup() {
  slotsEl.innerHTML = '';
  for (let i = 0; i < 3; i++) {
    const cat = CATS().find(c => c.id === selected[i]);
    const d = document.createElement('div');
    d.className = 'slot' + (cat ? ' filled' : '');
    d.innerHTML = cat ? `<div class="em">${cat.em}</div><div class="label">${cat.name}</div>` : `<div class="em" style="opacity:.35">＋</div><div>frei</div>`;
    slotsEl.appendChild(d);
  }
  catsEl.innerHTML = '';
  $('kidsToggle').setAttribute('aria-pressed', kidsMode);
  CATS().forEach(c => {
    const on = selected.includes(c.id);
    const b = document.createElement('button');
    b.className = 'cat' + (!on && selected.length >= 3 ? ' disabled' : '');
    b.setAttribute('aria-pressed', on);
    b.innerHTML = `<span class="mark"></span><span class="em">${c.em}</span><span>${c.name}</span>`;
    b.addEventListener('click', () => toggleCat(c.id));
    catsEl.appendChild(b);
  });
  document.querySelectorAll('#durations button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.sec === duration));
  const n = selected.length;
  startBtn.disabled = n === 0;
  startBtn.textContent = n === 0 ? 'Wähle eine Kategorie' : 'Spiel starten';
}
function toggleCat(id) {
  if (selected.includes(id)) selected = selected.filter(x => x !== id);
  else if (selected.length < 3) selected.push(id);
  else return;
  saveSettings(); renderSetup();
}
$('kidsToggle').addEventListener('click', () => {
  selectedByMode[kidsMode ? 'kids' : 'normal'] = selected;
  kidsMode = !kidsMode;
  selected = selectedByMode[kidsMode ? 'kids' : 'normal'];
  saveSettings(); renderSetup();
});
$('durations').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  duration = +b.dataset.sec; saveSettings(); renderSetup();
});

/* ---------------- Sound ---------------- */
let audioCtx = null;
function beep(freq, ms, type = 'sine', vol = 0.25) {
  if (!soundOn || !audioCtx) return;
  try {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + ms / 1000);
    o.connect(g).connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + ms / 1000);
  } catch (e) {}
}
const sfx = {
  tick: () => beep(880, 90),
  go: () => { beep(1046, 160); setTimeout(() => beep(1318, 220), 120); },
  ok: () => { beep(784, 110); setTimeout(() => beep(1175, 180), 90); },
  skip: () => beep(220, 220, 'square', 0.15),
  end: () => { beep(660, 150); setTimeout(() => beep(523, 150), 160); setTimeout(() => beep(392, 350), 320); },
};
$('soundBtn').addEventListener('click', () => {
  soundOn = !soundOn; saveSettings(); renderSound();
});
function renderSound() {
  $('sndOn').style.display = soundOn ? '' : 'none';
  $('sndOff').style.display = soundOn ? 'none' : '';
  $('soundBtn').setAttribute('aria-pressed', soundOn);
}

/* ---------------- Spiel ---------------- */
const gameEl = $('game'), stage = $('stage'), clock = $('clock'), manual = $('manual');
let phase = 'idle';           // idle | ready | count | play | flash | over
let deck = [], current = null, good = [], bad = [];
let endAt = 0, timerId = null, flashAt = 0, flashWasGood = false;
let armed = false;            // Sensor muss erst neutral stehen
let sensorOk = false, manualMode = false, wakeLock = null;

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function buildDeck() {
  const ids = selected.filter(id => id !== 'zufall');
  const pool = shuffle(CATS().filter(c => c.id !== 'zufall' && !ids.includes(c.id)).map(c => c.id));
  selected.filter(id => id === 'zufall').forEach(() => { if (pool.length) ids.push(pool.pop()); });
  const words = new Map();
  ids.forEach(id => CATS().find(c => c.id === id).words.forEach(w => words.set(typeof w === 'string' ? w : w.w, w)));
  deck = shuffle([...words.values()]);
  return ids;
}
function nextWord() {
  if (!deck.length) buildDeck();
  current = deck.pop();
}

function setPhase(p) {
  phase = p;
  gameEl.className = 'active ph-' + p;
  manual.className = 'manual' + (manualMode ? ' show' : '');
}

async function startGame() {
  // Audio + Sensorfreigabe brauchen eine Nutzergeste
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch (e) {}
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    try { const r = await DeviceOrientationEvent.requestPermission(); if (r !== 'granted') manualMode = true; } catch (e) { manualMode = true; }
  }
  if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
    try { await DeviceMotionEvent.requestPermission(); } catch (e) {}
  }
  try { if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen(); } catch (e) {}
  try { if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape'); } catch (e) {}
  try { if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}

  const ids = buildDeck();
  good = []; bad = []; current = null;
  showScreen('game');
  document.body.classList.add('playing');
  renderSound();
  showReady(ids);

  // Kein Sensor nach 1,5 s → Tasten einblenden
  sensorOk = false;
  setTimeout(() => {
    if (sensorOk) return;
    manualMode = true; renderManual();
    const r = stage.querySelector('.ready');
    if (r && !document.getElementById('sensorNote')) {
      const n = document.createElement('div'); n.className = 'sensor-note'; n.id = 'sensorNote';
      n.innerHTML = sensorDiagnosis(); r.appendChild(n);
    }
  }, 1500);
}

function showReady(ids) {
  const ems = ids.map(id => CATS().find(c => c.id === id).em).join(' ');
  clock.textContent = '';
  stage.innerHTML = `<div class="ready"><div class="em">${ems}</div><p>Halte dein Handy an die Stirn und kippe es nach vorne, um zu starten.</p><div class="hint">Nach vorne = richtig, nach hinten = überspringen</div></div>`;
  armed = false;
  setPhase('ready');
  renderManual();
}

function startCountdown() {
  setPhase('count');
  let n = 3;
  const tickFn = () => {
    if (phase !== 'count') return;
    if (n === 0) { beginRound(); return; }
    clock.textContent = n;
    stage.innerHTML = `<div class="big shout">Mach dich bereit</div>`;
    sfx.tick();
    n--;
    setTimeout(tickFn, 900);
  };
  tickFn();
}

function beginRound() {
  sfx.go();
  endAt = Date.now() + duration * 1000;
  timerId = setInterval(tickClock, 200);
  armed = false;
  nextWord(); showWord();
}
function showWord() {
  setPhase('play');
  stage.innerHTML = typeof current === 'string'
    ? `<div class="big">${current}</div>`
    : `<div class="pic"><div class="pic-em">${current.e}</div><div class="pic-label">${current.w}</div></div>`;
  renderManual();
}
function tickClock() {
  const left = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
  clock.textContent = left;
  if (left <= 0) endRound();
}
function answer(isGood) {
  if (phase !== 'play') return;
  (isGood ? good : bad).push(current);
  current = null;
  flashAt = Date.now(); flashWasGood = isGood;
  setPhase(isGood ? 'correct' : 'skip');
  stage.innerHTML = `<div class="big shout">${isGood ? 'Richtig' : 'Übersprungen'}</div>`;
  renderManual();
  isGood ? sfx.ok() : sfx.skip();
  armed = false;
  if (manualMode) setTimeout(continueAfterFlash, 700);
}
function continueAfterFlash() {
  if (phase !== 'correct' && phase !== 'skip') return;
  nextWord(); showWord();
}
function endRound() {
  clearInterval(timerId); timerId = null;
  if (phase === 'over' || phase === 'idle') return;
  phase = 'over';
  sfx.end();
  gameEl.className = 'active ph-over';
  stage.innerHTML = `<div class="big shout">Zeit um</div>`;
  manual.className = 'manual';
  setTimeout(showResult, 1200);
}
function quit() {
  clearInterval(timerId); timerId = null;
  if (phase === 'play' || phase === 'correct' || phase === 'skip') { phase = 'over'; showResult(); }
  else { phase = 'idle'; leaveGame(); showScreen('setup'); }
}
async function leaveGame() {
  document.body.classList.remove('playing');
  try { if (wakeLock) { await wakeLock.release(); wakeLock = null; } } catch (e) {}
  try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {}
  try { if (document.fullscreenElement) await document.exitFullscreen(); } catch (e) {}
}

/* ---------------- Neigungssensor ----------------
   Weltvertikale Komponente der Bildschirm-Normalen = cos(beta)·cos(gamma).
   ≈ 0  → Bildschirm steht senkrecht (an der Stirn)
   < 0  → Bildschirm zeigt nach unten (nach vorne gekippt) → RICHTIG
   > 0  → Bildschirm zeigt nach oben (nach hinten gekippt) → ÜBERSPRUNGEN
   Unabhängig von Gimbal-Lock, da das volle Produkt verwendet wird. */
const TRIGGER = 0.55, NEUTRAL = 0.3;
let orientationSeen = false;
function sensorFound() {
  if (sensorOk) return;
  sensorOk = true;
  const n = document.getElementById('sensorNote'); if (n) n.remove();
  if (manualMode) { manualMode = false; renderManual(); }
}
window.addEventListener('deviceorientation', e => {
  if (e.beta == null || e.gamma == null) return;
  orientationSeen = true; sensorFound();
  const b = e.beta * Math.PI / 180, g = e.gamma * Math.PI / 180;
  handleTilt(Math.cos(b) * Math.cos(g));
});
// Fallback: Beschleunigungssensor (Schwerkraftvektor), falls deviceorientation nichts liefert
window.addEventListener('devicemotion', e => {
  if (orientationSeen) return;
  const a = e.accelerationIncludingGravity;
  if (!a || a.z == null) return;
  const len = Math.hypot(a.x || 0, a.y || 0, a.z) || 1;
  if (len < 3) return;
  sensorFound();
  const ios = /iP(hone|ad|od)/.test(navigator.userAgent);
  handleTilt((ios ? -a.z : a.z) / len);
});
function sensorDiagnosis() {
  const embedded = window.self !== window.top;
  let blocked = false;
  try { if (document.featurePolicy && !document.featurePolicy.allowsFeature('accelerometer')) blocked = true; } catch (e) {}
  const brave = !!navigator.brave;
  let msg = '<b>Kein Bewegungssensor erkannt.</b> ';
  if (embedded || blocked) msg += 'Die Seite läuft eingebettet – öffne den Link oder die Datei direkt im Browser (neuer Tab). ';
  if (brave) msg += 'In Brave: Schild-Symbol antippen → Erweitert → Bewegungssensoren erlauben, oder Einstellungen → Website-Einstellungen → Bewegungssensoren. ';
  if (!embedded && !blocked && !brave) msg += 'Prüfe in den Browser-Einstellungen, ob Bewegungssensoren für diese Seite erlaubt sind. ';
  msg += 'Solange nutzt du die Tasten unten.';
  return msg;
}
function handleTilt(v) {
  if (Math.abs(v) < NEUTRAL) armed = true;
  if (!armed) return;
  if (phase === 'ready') {
    if (v < -TRIGGER) startCountdown();
  } else if (phase === 'play') {
    if (v < -TRIGGER) answer(true);
    else if (v > TRIGGER) answer(false);
  } else if (phase === 'correct' || phase === 'skip') {
    if (Date.now() - flashAt > 500) continueAfterFlash();
  }
}

/* Tasten-Fallback (kein Sensor / Desktop) */
function renderManual() {
  if (!manualMode) { manual.className = 'manual'; return; }
  manual.className = 'manual show';
  if (phase === 'ready') manual.innerHTML = `<button class="m-start" id="mStart">Los geht's</button>`;
  else if (phase === 'play') manual.innerHTML = `<button class="m-skip" id="mSkip">Überspringen</button><button class="m-ok" id="mOk">Richtig</button>`;
  else manual.innerHTML = '';
  const s = $('mStart'), k = $('mSkip'), o = $('mOk');
  if (s) s.addEventListener('click', startCountdown);
  if (k) k.addEventListener('click', () => answer(false));
  if (o) o.addEventListener('click', () => answer(true));
}
// Tastatur zum Testen am Rechner: → richtig, ← überspringen, Leertaste start
window.addEventListener('keydown', e => {
  if (!gameEl.classList.contains('active')) return;
  if (e.key === ' ' && phase === 'ready') startCountdown();
  if (e.key === 'ArrowRight') answer(true);
  if (e.key === 'ArrowLeft') answer(false);
});

/* ---------------- Ergebnis ---------------- */
function showResult() {
  leaveGame();
  const total = good.length + bad.length;
  $('scoreNum').textContent = good.length;
  $('scoreOf').textContent = total === 0 ? 'Kein Begriff gespielt' : `von ${total} Begriffen erraten`;
  const label = w => typeof w === 'string' ? w : `${w.e} ${w.w}`;
  const fill = (el, list) => { el.innerHTML = list.length ? list.map(w => `<span>${label(w)}</span>`).join('') : '<span class="empty" style="background:none;padding:0">–</span>'; };
  fill($('goodList'), good); fill($('badList'), bad);
  showScreen('result');
  window.scrollTo(0, 0);
}
$('againBtn').addEventListener('click', startGame);
$('changeBtn').addEventListener('click', () => { phase = 'idle'; showScreen('setup'); });

/* ---------------- Screens ---------------- */
function showScreen(id) {
  ['setup', 'game', 'result'].forEach(s => $(s).classList.toggle('active', s === id));
  if (id !== 'game') gameEl.className = '';
}
startBtn.addEventListener('click', startGame);
$('quitBtn').addEventListener('click', quit);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && wakeLock === null && document.body.classList.contains('playing')) { try { navigator.wakeLock && navigator.wakeLock.request('screen').then(w => wakeLock = w); } catch (e) {} } });

loadSettings();
renderSetup();
renderSound();
</script>
